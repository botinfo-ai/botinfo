# Owner policy for the simulated Unitree G1 (botinfo/backends/g1sim.py: MuJoCo + Unitree's published walking
# policy; simulation only, no hardware). Use it with bindings/g1sim-loco.toml (stop = velocity zero) or
# bindings/g1sim-loco-damp.toml (stop = damping, to see what that does to a walking G1).
# Every key is listed in docs/POLICY.md. Unknown keys are an error.

[policy]
name = "g1sim-walk"
robot = "Unitree G1, simulated (MuJoCo, unitree_rl_gym's 12-joint model and walking policy; no hardware)"
description = "Slow walking inside a 6 m x 6 m box. Faster than 0.4 m/s needs the owner's OK."
command_ttl_s = 5.0          # a pending command (waiting for confirmation) or a late one older than this is dropped
max_clock_skew_s = 1.0       # tolerance when judging a caller's issued_at
require_request_id = false   # true: every action call must carry a unique request_id
on_busy = "replace"          # a new motion replaces the running one (stop, then start)

[stop]
latch = true                 # after any stop, motion stays refused until the owner resumes
on_client_disconnect = "stop"
on_backend_error = "stop"

[lease]
keepalive_s = 0.2            # re-send Move this often; each Move walks for 1 s, so the robot stops by itself if BotInfo goes quiet
max_lease_s = 5.0            # no single motion runs longer than this without a renewal
renewable = true
max_total_s = 20.0           # no stretch of motion longer than this, whether by renewals or back-to-back commands
min_rest_s = 1.0             # ... without this much rest in between

[rate_limits]
all = { max = 40, window_s = 10.0 }      # every call except botinfo_stop
motion = { max = 5, window_s = 10.0 }    # motion commands accepted

[workspace]
x = [-3.0, 3.0]
y = [-3.0, 3.0]
margin_m = 0.3               # a walk whose predicted path leaves the box shrunk by this is refused
check_every_s = 0.1          # while walking, the pose is checked this often; outside the box = stop

[actions.walk]
kind = "motion"
description = "Walk at a constant forward speed and turn rate for a bounded time; the walk ends with the binding's stop (with bindings/g1sim-loco.toml, velocity zero: the robot keeps balancing)."
duration_param = "duration_s"
params.forward_mps = { type = "number", min = -0.2, max = 0.5, confirm_above = 0.4, unit = "m/s", description = "Forward speed (negative = backward)." }
params.turn_rps = { type = "number", min = -0.5, max = 0.5, default = 0.0, unit = "rad/s", description = "Turn rate (positive = left)." }
params.duration_s = { type = "number", min = 0.1, max = 5.0, unit = "s", description = "How long to walk." }
