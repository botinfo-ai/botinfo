# DRAFT, UNTESTED ON TURTLESIM: front ros-mcp-server (github.com/robotmcp/ros-mcp-server, Apache-2.0, v3.1.2)
# driving turtlesim through rosbridge. Not run: this Mac has no Docker and no ROS. The same pattern IS tested
# against BotInfo's emulated rosbridge + SimRover: bindings/ros-mcp-server-simrover.toml.
# Needs: rosbridge_server on ws://127.0.0.1:9090 with turtlesim (their tests/integration/docker/Dockerfile.ros2-humble
# is headless and multi-arch), and `uvx ros-mcp` available. Use with a turtlesim policy (turtlesim's world is
# 0..11.09 on both axes, and it moves each Twist for about 1 s, so keep keepalive_s well under 1 s).
# Stop and drive use publish_for_durations (one message, ~0.06 s per call), not publish_once: publish_once waits
# 1 s for a reply to advertise and 1 s for a reply to publish, which rosbridge never sends (measured against the
# emulator: ~2 s per call, message on the robot after ~1 s). Tool names and arguments are from ros-mcp-server's
# source (ros_mcp/tools/topics.py, services.py); result shapes were checked against the emulator, not turtlesim.

[binding]
kind = "mcp-tools"
label = "ros-mcp-server v3.1.2 + rosbridge + turtlesim (UNTESTED ON TURTLESIM)"
command = ["uvx", "ros-mcp", "--transport=stdio"]
error_keys = ["error", "errors"]

[stop]
call = { tool = "publish_for_durations", args = { topic = "/turtle1/cmd_vel", msg_type = "geometry_msgs/msg/Twist", messages = [ { linear = { x = 0.0, y = 0.0, z = 0.0 }, angular = { x = 0.0, y = 0.0, z = 0.0 } } ], durations = [0.05], rate_hz = 20 } }
repeat = 2

[actions.drive]
start = { tool = "publish_for_durations", args = { topic = "/turtle1/cmd_vel", msg_type = "geometry_msgs/msg/Twist", messages = [ { linear = { x = "$linear_mps", y = 0.0, z = 0.0 }, angular = { x = 0.0, y = 0.0, z = "$angular_rps" } } ], durations = [0.05], rate_hz = 20 } }
keepalive = "start"
path = { model = "unicycle", linear = "$linear_mps", angular = "$angular_rps", duration = "$duration_s" }

[actions.set_led]
# turtlesim has no light; its pen colour stands in (service /turtle1/set_pen, turtlesim/srv/SetPen). This draft
# always sets red: the color parameter is accepted by the policy but not passed through.
call = { tool = "call_service", args = { service_name = "/turtle1/set_pen", service_type = "turtlesim/srv/SetPen", request = { r = 255, g = 0, b = 0, width = 3, off = 0 } } }

[status]
call = { tool = "subscribe_once", args = { topic = "/turtle1/pose", msg_type = "turtlesim/msg/Pose" } }
fields.x = { path = "msg.x", type = "number" }
fields.y = { path = "msg.y", type = "number" }
fields.heading_rad = { path = "msg.theta", type = "number" }
fields.linear_mps = { path = "msg.linear_velocity", type = "number" }
fields.angular_rps = { path = "msg.angular_velocity", type = "number" }

[pose]
x = "x"
y = "y"
heading = "heading_rad"
