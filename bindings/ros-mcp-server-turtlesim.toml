# Front ros-mcp-server v3.1.2 (github.com/robotmcp/ros-mcp-server, Apache-2.0) driving turtlesim through rosbridge.
# Tested 2026-10-16 on real ROS 2 Humble (rosbridge_server 2.0.8, rosapi 2.0.8, turtlesim 1.4.3) in a local
# container: the benchmark stack ros-mcp-server-turtlesim/botinfo uses this file with policies/turtlesim.toml.
# Needs rosbridge_server on ws://127.0.0.1:9090 with turtlesim and rosapi (botinfo/bench/docker/ros2-humble-turtlesim),
# and `uvx ros-mcp` available. turtlesim's world runs 0 to 11.09 on both axes, and it stops the turtle 1 s after
# the last Twist (measured), so keep keepalive_s well under 1 s.
# Stop and drive use publish_for_durations (one message, ~0.08 s per call on real rosbridge), not publish_once:
# publish_once waits 1 s for a reply to advertise and 1 s for a reply to publish, which rosbridge never sends
# (measured on rosbridge 2.0.8: 2.03 s per call, Twist on the turtle after 1.02 s).
# set_led maps to the pen colour (/turtle1/set_pen); this binding always sets red.

[binding]
kind = "mcp-tools"
label = "ros-mcp-server v3.1.2 (rosbridge) + turtlesim"
command = ["uvx", "ros-mcp", "--transport=stdio"]
error_keys = ["error", "errors"]

[stop]
call = { tool = "publish_for_durations", args = { topic = "/turtle1/cmd_vel", msg_type = "geometry_msgs/msg/Twist", messages = [ { linear = { x = 0.0, y = 0.0, z = 0.0 }, angular = { x = 0.0, y = 0.0, z = 0.0 } } ], durations = [0.05], rate_hz = 20 } }
repeat = 2

[actions.drive]
start = { tool = "publish_for_durations", args = { topic = "/turtle1/cmd_vel", msg_type = "geometry_msgs/msg/Twist", messages = [ { linear = { x = "$linear_mps", y = 0.0, z = 0.0 }, angular = { x = 0.0, y = 0.0, z = "$angular_rps" } } ], durations = [0.05], rate_hz = 20 } }
keepalive = "start"
path = { model = "unicycle", linear = "$linear_mps", angular = "$angular_rps", duration = "$duration_s" }

[actions.set_led]
call = { tool = "call_service", args = { service_name = "/turtle1/set_pen", service_type = "turtlesim/srv/SetPen", request = { r = 255, g = 0, b = 0, width = 3, off = 0 } } }

[status]
call = { tool = "subscribe_once", args = { topic = "/turtle1/pose", msg_type = "turtlesim/msg/Pose" } }
fields.x = { path = "msg.x", type = "number" }
fields.y = { path = "msg.y", type = "number" }
fields.heading_rad = { path = "msg.theta", type = "number" }
fields.linear_mps = { path = "msg.linear_velocity", type = "number" }
fields.angular_rps = { path = "msg.angular_velocity", type = "number" }

[pose]
x = "x"
y = "y"
heading = "heading_rad"
