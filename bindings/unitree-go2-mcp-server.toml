# Front unitree-go2-mcp-server (github.com/lpigeon/unitree-go2-mcp-server, Apache-2.0) at commit e7a6737d, with
# policies/go2.toml. Tested 2026-10-17 only in simulation: the benchmark stacks go2-*/botinfo run the server's own code
# and the real ros2 CLI on ROS 2 Humble in a local container, against BotInfo's stand-in Go2 node (not a Go2, not a
# Go2 simulator). Never run against a robot.
#
# What the server does (read at that commit, then measured): every tool shells out to
# `ros2 topic pub /wirelesscontroller unitree_go/msg/WirelessController ...`, one new process per command, and
# handles one tool call at a time. pub_wirelesscontroller with duration D streams for D s at 10 Hz, then sends its
# own stop (sticks centred, 3 messages) from a second process: measured 4.4 s for D = 2, first message 0.65 s after
# the call, the stop 1.15 s after the last message. A call cannot be interrupted, so a stop waits for the move
# that is running. That is why:
#   - drive is one call for the whole move (duration = $duration_s), not a stream of keep-alives;
#   - start_mode = "send": BotInfo puts that call on the wire and returns at once, so the agent and the owner can
#     still reach BotInfo while the server is busy (a stop is latched at once, and reaches the robot after the move);
#   - the policy's lease ends with this stop; renewals are off.
# The stop here centres the sticks. It is not a damping mode or an emergency stop.
#
# command: how BotInfo would launch the server next to a robot (adjust the path). The benchmark launches it itself,
# inside the container.

[binding]
kind = "mcp-tools"
label = "unitree-go2-mcp-server (commit e7a6737)"
command = ["uv", "run", "--directory", "/ABSOLUTE/PATH/unitree-go2-mcp-server", "python", "server.py"]
error_keys = ["error"]

[stop]
call = { tool = "stop", args = {} }
repeat = 1

[actions.drive]
start = { tool = "pub_wirelesscontroller", args = { linear_x = "$linear_mps", linear_y = 0.0, yaw = "$angular_rps", pitch = 0.0, keys = 0, duration = "$duration_s" } }
start_mode = "send"
keepalive = "none"
