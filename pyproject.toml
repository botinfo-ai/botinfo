[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botinfo"
version = "0.1.0"
description = "BotInfo: a policy layer between AI agents and owner-connected robots, plus the BotInfo Benchmark (v0: simulation and mocks only)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "BotInfo.ai" }]

[project.scripts]
botinfo = "botinfo.cli:main"

[tool.setuptools.packages.find]
include = ["botinfo*"]
